name: PSScriptAnalyzer

on:
  push:
    paths:
      - '**.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/psscriptanalyzer.yml'
  pull_request:
    paths:
      - '**.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/psscriptanalyzer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error)
          $results | Format-Table -AutoSize

          # Annotate each finding on the diff so reviewers see it in context
          # rather than having to open the job log.
          $root = (Get-Location).Path + [System.IO.Path]::DirectorySeparatorChar
          foreach ($result in $results) {
            $level = 'warning'
            if ($result.Severity -eq 'Error') { $level = 'error' }
            $file = $result.ScriptPath -replace [regex]::Escape($root), ''
            Write-Output "::${level} file=${file},line=$($result.Line),col=$($result.Column)::$($result.RuleName): $($result.Message)"
          }

          $errors   = @($results | Where-Object { $_.Severity -eq 'Error' })
          $warnings = @($results | Where-Object { $_.Severity -eq 'Warning' })

          # Warnings gate the build as well as errors: this script runs
          # unattended as SYSTEM, so the analyzer's warning-level rules about
          # null comparison, aliases and unapproved verbs are the difference
          # between a clear log and a mystery ticket. Suppress a genuine false
          # positive inline with a justification instead of relaxing this.
          if ($errors.Count -gt 0 -or $warnings.Count -gt 0) {
            Write-Output "::error::PSScriptAnalyzer found $($errors.Count) error(s) and $($warnings.Count) warning(s). Both gate this build."
            exit 1
          }

          Write-Output "PSScriptAnalyzer found no errors or warnings."
